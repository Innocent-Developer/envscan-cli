name: Release

# Tag-based release process: publishing only happens when a maintainer
# explicitly creates a GitHub Release (Releases -> Draft a new release).
# Normal pushes to main never trigger a publish.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # If you configure an "Environment name" when adding this repo as a
    # trusted publisher on npmjs.com, uncomment the line below and set it
    # to the exact same name — the OIDC claims must match.
    # environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # npm Trusted Publishing (OIDC) requires npm CLI >= 11.5.1.
      # Node 22's bundled npm is older than that as of this writing, so
      # this step force-upgrades npm on the runner before publishing.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches the release tag
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG). Bump package.json and re-tag before publishing."
            exit 1
          fi

      # No --provenance flag and no NODE_AUTH_TOKEN/NPM_TOKEN: with a
      # configured trusted publisher, npm exchanges this job's GitHub
      # OIDC token for a short-lived registry token and attaches
      # provenance attestations automatically.
      - name: Publish to npm
        run: npm publish
